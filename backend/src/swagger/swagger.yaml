  /api/syllabus:
    post:
      summary: Create embedded syllabus version
      description: Creates a task-based syllabus version using embedded Subject -> Topic -> SubTopic -> Tasks structure.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, levelId, subLevelId, version, subjects]
              properties:
                sessionId:
                  type: string
                levelId:
                  type: string
                subLevelId:
                  type: string
                version:
                  type: string
                title:
                  type: string
                subjects:
                  type: array
                  items:
                    $ref: '#/components/schemas/SyllabusSubject'
            example:
              sessionId: "64fdb61e7b9a1a1234567894"
              levelId: "64fdb61e7b9a1a1234567892"
              subLevelId: "64fdb61e7b9a1a1234567893"
              version: "v1.0"
              title: "Frontend Beginner Syllabus"
              subjects:
                - name: "Frontend Development"
                  code: "FE-101"
                  topics:
                    - name: "HTML"
                      subTopics:
                        - name: "HTML Forms"
                          tasks:
                            - title: "HTML Forms Practice"
                              description: "Create a working form with validations"
                              type: "practice"
                              mandatory: true
                              maxMarks: 5
      responses:
        '201':
          description: Syllabus version created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Syllabus version created successfully"
                  data:
                    allOf:
                      - $ref: '#/components/schemas/SyllabusVersion'
                      - type: object
                        properties:
                          taskCount:
                            type: integer
                            example: 1
        '400':
          description: Validation error
    get:
      summary: Get all syllabus versions
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sessionId
          schema:
            type: string
        - in: query
          name: levelId
          schema:
            type: string
        - in: query
          name: subLevelId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: ["draft", "active", "archived"]
      responses:
        '200':
          description: Syllabus versions fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 2
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/SyllabusVersion'
                        - type: object
                          properties:
                            taskCount:
                              type: integer
                              example: 10

