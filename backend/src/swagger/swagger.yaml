          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Manual task assignment completed: 2 succeeded, 0 failed"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        success:
                          type: boolean
                        studentId:
                          type: string
                        syllabusVersionId:
                          type: string
                        createdCount:
                          type: integer
                        updatedCount:
                          type: integer
                        totalTasks:
                          type: integer
                        message:
                          type: string
                          description: Present only if success is false
        '400':
