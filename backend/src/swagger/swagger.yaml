  /api/syllabus/{id}/tasks:
    post:
      summary: Add task to syllabus version
      description: Adds a new task inside a selected subject/topic/subtopic. If syllabus is active, existing student tasks are synced.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, topicId, title]
              properties:
                subjectId:
                  type: string
                topicId:
                  type: string
                subTopicId:
                  type: string
                  description: Optional. If provided, task is added under the subtopic; otherwise it is added directly under the topic.
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                mandatory:
                  type: boolean
                maxMarks:
                  type: number
            example:
              subjectId: "6808be4d12ab34cd56ef7501"
              topicId: "6808be4d12ab34cd56ef7601"
              subTopicId: "6808be4d12ab34cd56ef7701"
              title: "Build Login Form"
              description: "Create a login form using semantic HTML"
              type: "assignment"
              mandatory: true
              maxMarks: 5
      responses:
        '201':
          description: Task added successfully
        '400':
          description: Validation error
        '404':
          description: Syllabus version or node not found

