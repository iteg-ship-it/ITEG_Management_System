
openapi: 3.0.0
info:
  title: ITEG Management API
  version: 1.0.0
  description: API for managing users like admin, superadmin, and faculty.

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Department:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567890"
        name:
          type: string
          example: "ITEG"
        code:
          type: string
          example: "ITEG001"
        universityName:
          type: string
          example: "SSISM"
        allowedCourses:
          type: array
          items:
            type: object
            properties:
              courseName:
                type: string
                example: "BCA"
              durationInYears:
                type: number
                example: 3
        reportConfig:
          type: object
          properties:
            templateType:
              type: string
              enum: ["ITEG_STANDARD", "MEG_WEIGHTED", "BEG_CUTOFF", "BTECH_STAGE"]
              example: "ITEG_STANDARD"
            sections:
              type: object
              properties:
                showTechnicalSkills:
                  type: boolean
                  example: true
                showSoftSkills:
                  type: boolean
                  example: true
                showDiscipline:
                  type: boolean
                  example: true
                showProjects:
                  type: boolean
                  example: true
                showCareerReadiness:
                  type: boolean
                  example: true
                showUniversityAcademicHistory:
                  type: boolean
                  example: true
                showTaskCompletionPercentage:
                  type: boolean
                  example: true
                showEvaluationBreakdown:
                  type: boolean
                  example: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Level:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567892"
        name:
          type: string
          example: "Level 1"
        order:
          type: number
          example: 1
        subDepartmentId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567891"
            - $ref: '#/components/schemas/SubDepartment'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubLevel:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567893"
        name:
          type: string
          example: "SubLevel 1A"
        order:
          type: number
          example: 1
        levelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567892"
            - $ref: '#/components/schemas/Level'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567894"
        name:
          type: string
          example: "2023-24"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SyllabusTask:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7801"
        title:
          type: string
          example: "HTML Forms Practice"
        description:
          type: string
          example: "Create a working form with validations"
        type:
          type: string
          enum: ["assignment", "project", "practice", "reading", "assessment", "other"]
          example: "practice"
        mandatory:
          type: boolean
          example: true
        maxMarks:
          type: number
          nullable: true
          example: 5
        order:
          type: number
          example: 1
        isActive:
          type: boolean
          example: true

    SyllabusSubTopic:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7701"
        name:
          type: string
          example: "HTML Forms"
        description:
          type: string
          example: "Form tags and input controls"
        order:
          type: number
          example: 1
        isActive:
          type: boolean
          example: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusTask'

    SyllabusTopic:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7601"
        name:
          type: string
          example: "HTML"
        description:
          type: string
          example: "HTML core concepts"
        order:
          type: number
          example: 1
        isActive:
          type: boolean
          example: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusTask'
        subTopics:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusSubTopic'

    SyllabusSubject:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7501"
        name:
          type: string
          example: "Frontend Development"
        code:
          type: string
          example: "FE-101"
        description:
          type: string
          example: "Frontend foundation syllabus"
        order:
          type: number
          example: 1
        isActive:
          type: boolean
          example: true
        topics:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusTopic'

    SyllabusVersion:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7401"
        sessionId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567894"
            - $ref: '#/components/schemas/Session'
        levelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567892"
            - $ref: '#/components/schemas/Level'
        subLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567893"
            - $ref: '#/components/schemas/SubLevel'
        version:
          type: string
          example: "v1.0"
        title:
          type: string
          example: "Frontend Beginner Syllabus"
        status:
          type: string
          enum: ["draft", "active", "archived"]
          example: "draft"
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusSubject'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudentTask:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7901"
        studentId:
          type: string
          example: "6808be4d12ab34cd56ef7101"
        syllabusVersionId:
          type: string
          example: "6808be4d12ab34cd56ef7401"
        taskId:
          type: string
          example: "6808be4d12ab34cd56ef7801"
        subjectId:
          type: string
          example: "6808be4d12ab34cd56ef7501"
        topicId:
          type: string
          example: "6808be4d12ab34cd56ef7601"
        subTopicId:
          type: string
          nullable: true
          example: "6808be4d12ab34cd56ef7701"
        subjectName:
          type: string
          example: "Frontend Development"
        topicName:
          type: string
          example: "HTML"
        subTopicName:
          type: string
          nullable: true
          example: "HTML Forms"
        taskNodeType:
          type: string
          enum: ["topic", "subTopic"]
          example: "subTopic"
        title:
          type: string
          example: "HTML Forms Practice"
        description:
          type: string
          example: "Create a working form with validations"
        type:
          type: string
          example: "practice"
        mandatory:
          type: boolean
          example: true
        maxMarks:
          type: number
          nullable: true
          example: 5
        status:
          type: string
          enum: ["pending", "inProgress", "completed"]
          example: "pending"
        marks:
          type: number
          nullable: true
          example: 18
        notes:
          type: string
          example: "Completed with responsive layout"
        assignedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudentTaskSummary:
      type: object
      properties:
        total:
          type: integer
          example: 12
        pending:
          type: integer
          example: 5
        inProgress:
          type: integer
          example: 3
        completed:
          type: integer
          example: 4
        progressPercent:
          type: integer
          example: 33

    StudentProfile:
      type: object
      properties:
        _id:
          type: string
          example: "6808be4d12ab34cd56ef7101"
        prkey:
          type: string
          example: "PR-1001"
        firstName:
          type: string
          example: "Aman"
        lastName:
          type: string
          example: "Sharma"
        fatherName:
          type: string
          example: "Rajesh Sharma"
        email:
          type: string
          example: "aman@example.com"
        studentMobile:
          type: string
          example: "9876543210"
        parentMobile:
          type: string
          example: "9876500000"
        subDepartmentId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567891"
            - $ref: '#/components/schemas/SubDepartment'
        sessionId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567894"
            - $ref: '#/components/schemas/Session'
        currentLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567892"
            - $ref: '#/components/schemas/Level'
        currentSubLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567893"
            - $ref: '#/components/schemas/SubLevel'
        syllabusVersionId:
          oneOf:
            - type: string
              example: "6808be4d12ab34cd56ef7401"
            - type: object
              properties:
                _id:
                  type: string
                  example: "6808be4d12ab34cd56ef7401"
                title:
                  type: string
                  example: "Frontend Beginner Syllabus"
                version:
                  type: string
                  example: "v1.0"
                status:
                  type: string
                  example: "active"
        selectedCourse:
          type: string
          example: "BCA"
        isFTP:
          type: boolean
          example: false
        status:
          type: string
          enum: ["Active", "Completed", "Dropped", "Placed"]
          example: "Active"
        academicHistory:
          type: array
          items:
            type: object
            properties:
              yearName:
                type: string
                example: "1st Year"
              percentage:
                type: number
                example: 78
              result:
                type: string
                enum: ["Pass", "Fail"]
                example: "Pass"
              updatedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PromotionHistory:
      type: object
      properties:
        _id:
          type: string
          example: "6810be4d12ab34cd56ef9901"
        fromLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567892"
            - $ref: '#/components/schemas/Level'
        fromSubLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567893"
            - $ref: '#/components/schemas/SubLevel'
        toLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567895"
            - $ref: '#/components/schemas/Level'
        toSubLevelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567896"
            - $ref: '#/components/schemas/SubLevel'
        promotedBy:
          oneOf:
            - type: string
              example: "662b18b6c3eabc00123f5678"
            - $ref: '#/components/schemas/User'
        promotedByName:
          type: string
          example: "Faculty User"
        promotedByRole:
          type: string
          example: "faculty"
        remark:
          type: string
          example: "Completed all pending tasks"
        promotedAt:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567890"
        companyName:
          type: string
          example: "TCS Pvt Ltd"
        location:
          type: string
          example: "Bangalore, India"
        companyLogo:
          type: string
          example: "https://cloudinary.com/logo.png"
        hrEmail:
          type: string
          format: email
          example: "hr@tcs.com"
        hrContact:
          type: string
          example: "+91-9876543210"
        headOffice:
          type: string
          example: "Mumbai, India"
    
    PlacedStudent:
      type: object
      properties:
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012345"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        course:
          type: string
          example: "B.Tech CSE"
        placedInfo:
          type: object
          properties:
            salary:
              type: number
              example: 500000
            jobProfile:
              type: string
              example: "Software Developer"
            location:
              type: string
              example: "Bangalore, India"

    User:
      type: object
      properties:
        _id:
          type: string
          example: "662b18b6c3eabc00123f5678"
        profileImage:
          type: string
          example: "https://example.com/profile.jpg"
        position:
          type: string
          example: "Developer"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "johndoe@example.com"
        mobileNo:
          type: string
          example: "9876543210"
        adharCard:
          type: string
          example: "123456789012"
        password:
          type: string
          example: "$2b$10$somethinghashed"   # Password will be hashed
        role:
          type: string
          example: "admin"
        department:
          type: string
          example: "IT"
        refreshToken:
          type: string
          example: "some-refresh-token"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-04-29T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-04-29T08:30:00.000Z"
    
    SubDepartment:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567891"
        name:
          type: string
          example: "Computer Applications"
        departmentId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567890"
            - $ref: '#/components/schemas/Department'
        allowedCourses:
          type: array
          items:
            type: string
          example: ["BCA", "MCA"]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    StudentReportCard:
      type: object
      required:
        - studentRef
        - batchYear
        - generatedByName
      properties:
        studentRef:
          type: string
          description: Reference to AdmittedStudent
          example: "671ff96e0b213a12bca4d1b5"
        batchYear:
          type: string
          description: Batch year
          example: "2025"
        generatedByName:
          type: string
          description: Name of the user who generated the report
          example: "John Doe"
        technicalSkills:
          type: array
          items:
            type: object
            properties:
              skillName:
                type: string
                example: "React"
              theoryMarks:
                type: number
                example: 80
              practicalMarks:
                type: number
                example: 90
              totalPercentage:
                type: number
                example: 85
              remark:
                type: string
                example: "Good"
        softSkills:
          type: object
          properties:
            sectionTitle:
              type: string
              example: "Soft Skills Evaluation (50 Marks)"
            categories:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                    example: "Presentation Skills"
                  maxMarks:
                    type: number
                    example: 10
                  subcategories:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "Content & Structure"
                        value:
                          type: boolean
                          example: true
                  score:
                    type: number
                    example: 8
            totalSoftSkillMarks:
              type: number
              example: 40
        discipline:
          type: object
          properties:
            sectionTitle:
              type: string
              example: "Discipline Evaluation (30 Marks)"
            categories:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                    example: "Attendance"
                  maxMarks:
                    type: number
                    example: 10
                  subcategories:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "Punctuality"
                        value:
                          type: boolean
                          example: true
                  score:
                    type: number
                    example: 8
            totalDisciplineMarks:
              type: number
              example: 25
    Admission:
      type: object
      required:
        - prkey
        - firstName
        - lastName
        - fatherName
        - studentMobile
        - parentMobile
        - gender
        - dob
        - aadharCard
        - address
        - stream
        - course
        - category
        - subject12
        - year12
        - percent12
        - percent10
      properties:
        prkey:
          type: string
          example: PR123456
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        fatherName:
          type: string
          example: Richard Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        studentMobile:
          type: string
          example: "9876543210"
        parentMobile:
          type: string
          example: "9123456780"
        gender:
          type: string
          example: Male
        dob:
          type: string
          format: date
          example: 2000-01-01
        aadharCard:
          type: string
          example: "123456789012"
        address:
          type: string
          example: "123 Main St, City, State"
        stream:
          type: string
          example: Science
        course:
          type: string
          example: B.Sc
        category:
          type: string
          example: General
        subject12:
          type: string
          example: Physics
        year12:
          type: string
          example: "2018"
        percent12:
          type: string
          example: "85%"
        percent10:
          type: string
          example: "85%"
        itegInterviewFlag:
          type: boolean
          example: false
        admissionStatus:
          type: boolean
          example: false
        admissionDate:
          type: string
          format: date
          example: 2025-04-25
        interviewStage:
          type: string
          enum:
            - Registered
            - Test Scheduled
            - Test not Attempted
            - Test Completed
            - First Interview Scheduled
            - First Interview Passed
            - Second Interview Scheduled
            - Second Interview Passed
            - ITEG Interview Completed
          example: Registered
        onlineTest:
          type: object
          properties:
            date:
              type: string
              format: date
              example: 2025-04-20
            testLink:
              type: string
              example: http://example.com/test
            result:
              type: string
              enum: [Pass, Fail, Pending, Not Attempted]
              example: Pending
        interviews:
          type: array
          items:
            type: object
            properties:
              round:
                type: string
                enum: [First, Second]
                example: First
              assignment:
                type: string
                example: "Assignment details here"
              attemptNo:
                type: integer
                example: 1
              communication:
                type: number
                example: 5
              confidence:
                type: number
                example: 4
              goal:
                type: number
                example: 3
              subjectKnowlage:
                type: number
                example: 4
              assignmentMarks:
                type: number
                example: 4
              sincerity:
                type: number
                example: 4
              maths:
                type: number
                example: 4
              reasoning:
                type: number
                example: 4
              created_by:
                type: string
                example: "faculty"
              marks:
                type: number
                example: 85
              remark:
                type: string
                example: Good performance
              date:
                type: string
                format: date
                example: 2025-04-22
              result:
                type: string
                enum: [Pass, Fail, Pending]
                example: Pass
        scheduledInterview:
          type: object
          properties:
            date:
              type: string
              format: date
              example: 2025-04-25
            round:
              type: string
              enum: [First, Second]
              example: First
            isScheduled:
              type: boolean
              example: true
    AdmissionLevel:
      type: object
      properties:
        levelNo:
          type: string
          example: "1"
        noOfAttempts:
          type: integer
          default: 0
        Topic:
          type: string
          example: "Java"
        marks:
          type: number
          default: 0
        remark:
          type: string
        date:
          type: string
          format: date
        result:
          type: string
          enum: [Pass, Fail, Pending]
          default: Pending

    PlacedInfo:
      type: object
      properties:
        companyName:
          type: string
        salary:
          type: number
        location:
          type: string

    InterviewRecord:
      type: object
      properties:
        companyName:
          type: string
        interviewDate:
          type: string
          format: date
        remark:
          type: string
        result:
          type: string
          enum: [Selected, Rejected, Pending]
          default: Pending
        location:
          type: string
        jobProfile:
          type: string

    AdmittedStudent:
      type: object
      required:
        - admissionRef
        - fullName
        - prkey
        - stream
        - course
        - fatherName
        - mobileNo
        - address
        - track
        - village
      properties:
        admissionRef:
          type: string
          format: uuid
        fullName:
          type: string
        prkey:
          type: string
        stream:
          type: string
        course:
          type: string
        fatherName:
          type: string
        mobileNo:
          type: string
        email:
          type: string
        address:
          type: string
        track:
          type: string
        village:
          type: string
        level:
          type: array
          items:
            $ref: '#/components/schemas/AdmissionLevel'
        techno:
          type: string
        attendancePercentage:
          type: number
          minimum: 0
          maximum: 100
        placedInfo:
          $ref: '#/components/schemas/PlacedInfo'
        permissionRequired:
          type: boolean
          default: false
        interviewRecord:
          type: array
          items:
            $ref: '#/components/schemas/InterviewRecord'
        readinessStatus:
          type: string
          enum: [Ready, Not Ready]
          default: Not Ready
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  # ===== DEPARTMENT APIs =====
  /api/departments:
    post:
      summary: Create a new department
      tags:
        - Department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
                - universityName
                - reportConfig
              properties:
                name:
                  type: string
                  example: "ITEG"
                code:
