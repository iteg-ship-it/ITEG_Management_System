      responses:
        '200':
          description: Student profile task summary fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StudentTaskSummary'
        '400':
          description: syllabusVersionId missing and no syllabus assigned to student
        '404':
          description: Student not found

  /api/students/{studentId}/profile/tasks/{taskId}:
    patch:
      summary: Update student task from profile
      description: Updates status, optional marks, and notes for a task from the individual student profile flow.
      tags:
        - Student Profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["pending", "inProgress", "completed"]
                marks:
                  type: number
                notes:
                  type: string
            example:
              status: "inProgress"
              marks: 10
              notes: "Started working on this task"
      responses:
        '200':
          description: Student task status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/StudentTask'
        '400':
          description: Invalid update or task not found
        '404':
          description: Student not found

  /api/students/{studentId}/promotion/preview:
    get:
      summary: Get next promotion preview for a student
      tags:
        - Student Promotion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Promotion preview fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      student:
                        type: object
                      next:
                        type: object
                        properties:
                          level:
                            $ref: '#/components/schemas/Level'
                          subLevel:
                            $ref: '#/components/schemas/SubLevel'
                          syllabusVersion:
                            oneOf:
                              - $ref: '#/components/schemas/SyllabusVersion'
                              - type: 'null'
                          transitionType:
                            type: string
                            enum: ["subLevel", "level"]
        '400':
          description: Student is already at final stage or progression cannot be resolved
        '404':
          description: Student not found

  /api/students/{studentId}/promotion/history:
    get:
      summary: Get student promotion history
      tags:
        - Student Promotion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Promotion history fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PromotionHistory'
        '404':
          description: Student not found

  /api/students/{studentId}/promotion:
    patch:
      summary: Promote student to next level or sublevel
      description: Faculty, admin, or superadmin can promote a student. The API automatically resolves the next sublevel first, otherwise the first sublevel of the next level, and assigns the active syllabus tasks for that stage.
      tags:
        - Student Promotion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                remark:
                  type: string
            example:
              remark: "Promoted after faculty review"
      responses:
        '200':
          description: Student promoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      studentId:
                        type: string
                      promotedTo:
                        type: object
                        properties:
                          level:
                            $ref: '#/components/schemas/Level'
                          subLevel:
                            $ref: '#/components/schemas/SubLevel'
                          syllabusVersion:
                            $ref: '#/components/schemas/SyllabusVersion'
                      assignment:
                        type: object
                        properties:
                          createdCount:
                            type: integer
                          updatedCount:
                            type: integer
                          totalTasks:
                            type: integer
                      lastPromotion:
                        $ref: '#/components/schemas/PromotionHistory'
        '400':
          description: Promotion blocked because next stage or syllabus is unavailable
        '401':
          description: Authenticated faculty user not found
        '404':
          description: Student not found

  /api/reportcards:
    post:
      summary: Save student report card data
      description: Stores report card data for a student including technical skills, soft skills, discipline, and other assessment information.
      tags:
        - Report Cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentReportCard'
            example:
              studentRef: "671ff96e0b213a12bca4d1b5"
              batchYear: "2025"
              generatedBy: "671a3b520f49e81d9f879e32"
              generatedByName: "John Doe"
              generatedByRole: "faculty"
              overallGrade: "A"
              facultyRemark: "Excellent progress this level."
              isFinalReport: false
      responses:
        '201':
          description: Report card created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Report card saved successfully"
                  data:
                    $ref: '#/components/schemas/StudentReportCard'
        '400':
          description: Validation error - Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Missing required fields: studentRef, generatedBy, generatedByName, generatedByRole"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"
                  error:
                    type: string
                    example: "Error message details"

  /api/reportcards/{studentId}:
    get:
      summary: Get student report card by student ID
