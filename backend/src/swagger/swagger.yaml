  # ===== PLACEMENT WORKFLOW APIs =====
  
  /api/admitted/students/interviews/{id}:
    post:
      summary: 1. Create/Schedule Interview
      description: Schedule interview for ready student with company details
      tags:
        - Placement Workflow
      parameters:
        - name: id
          in: path
          required: true
          description: Student ID
          schema:
            type: string
            example: "64a1b2c3d4e5f6789012345"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyName
                - hrEmail
                - location
                - jobProfile
                - scheduleDate
              properties:
                companyName:
                  type: string
                  example: "TechCorp Solutions"
                hrEmail:
                  type: string
                  format: email
                  example: "hr@techcorp.com"
                hrContact:
                  type: string
                  description: Optional - HR contact number
                  example: "+91-9876543210"
                location:
                  type: string
                  example: "Bangalore, India"
                jobProfile:
                  type: string
                  example: "Software Developer"
                scheduleDate:
                  type: string
                  format: date-time
                  example: "2024-01-20T10:00:00Z"
      responses:
        '201':
          description: Interview scheduled successfully
        '400':
          description: Missing required fields or student not ready
        '500':
          description: Server error

  /api/admitted/students/update/interviews/{studentId}/{interviewId}:
    patch:
      summary: 2. Update Interview Status
      description: Update interview status (Ongoing/Pending/Reschedule/Selected/Rejected)
      tags:
        - Placement Workflow
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            example: "64a1b2c3d4e5f6789012345"
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            example: "64a1b2c3d4e5f6789012346"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Scheduled, Rescheduled, Ongoing, Selected, RejectedByStudent, RejectedByCompany]
                  example: "Selected"
                rescheduleDate:
                  type: string
                  format: date-time
                  description: Required if status is Rescheduled
                  example: "2024-01-25T10:00:00Z"
      responses:
        '200':
          description: Interview status updated successfully
        '404':
          description: Student or interview not found
        '500':
          description: Server error

  /api/admitted/students/interviews/{studentId}/{interviewId}/add_round:
    post:
      summary: 3. Add Interview Round
      description: Add multiple rounds to existing interview
      tags:
        - Placement Workflow
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            example: "64a1b2c3d4e5f6789012345"
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            example: "64a1b2c3d4e5f6789012346"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
              properties:
                roundName:
                  type: string
                  example: "Technical Round"
                date:
                  type: string
                  format: date-time
                  example: "2024-01-22T14:00:00Z"
                mode:
                  type: string
                  enum: [Online, Offline, Telephonic]
                  default: Offline
                  example: "Online"
                feedback:
                  type: string
                  example: "Good technical skills"
                result:
                  type: string
                  enum: [Passed, Failed, Pending]
                  default: Pending
                  example: "Passed"
      responses:
        '200':
          description: Interview round added successfully
        '404':
          description: Interview not found
        '500':
          description: Server error

