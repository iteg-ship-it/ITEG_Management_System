  /api/admitted/students/confirm_placement:
    post:
      summary: 6. Confirm Placement (Auto-detect Interview or Direct)
      description: |
        Automatically confirms student placement by detecting the type:
        1. **Interview-based**: Auto-detects if student has selected interview with matching jobProfile
        2. **Direct placement**: When no matching selected interview found, requires companyRef
        
        The API automatically fills companyRef and interviewRecordId when interview is detected.
      tags:
        - Placement Workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - companyName
                - salary
                - location
                - jobProfile
              properties:
                studentId:
                  type: string
                  description: ID of the student
                  example: "64a1b2c3d4e5f6789012345"
                companyName:
                  type: string
                  description: "Name of the company"
                  example: "TechCorp Solutions"
                salary:
                  type: number
                  description: "Salary amount"
                  example: 500000
                location:
                  type: string
                  description: "Job location"
                  example: "Bangalore, India"
                jobProfile:
                  type: string
                  description: "Job position/profile (used to match with interview records)"
                  example: "Software Developer"
                jobType:
                  type: string
                  enum: [Internship, Full-Time, PPO]
                  default: Full-Time
                  description: "Type of job"
                  example: "Full-Time"
                joiningDate:
                  type: string
                  format: date
                  description: "Optional - Joining date"
                  example: "2024-07-01"
                offerLetter:
                  type: string
                  description: "Optional - Base64 encoded offer letter file (PDF/Image)"
                  example: "data:application/pdf;base64,JVBERi0xLjQKJcOkw7zDssO..."
                application:
                  type: string
                  description: "Optional - Base64 encoded application file (PDF/Image)"
                  example: "data:application/pdf;base64,JVBERi0xLjQKJcOkw7zDssO..."

      responses:
        '200':
          description: Student placement confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Student placement confirmed successfully"
                  data:
                    type: object
                    description: "Placement information"
        '400':
          description: Missing required fields, student already placed, or interview not in selected state
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Missing required fields: studentId, companyName, salary, location, jobProfile"
        '404':
          description: Student, company, or interview not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Student not found"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Server error message"

