  /api/students/{id}/promote:
    post:
      summary: Promote student to next sub-level or level
      description: |
        Promotes a student to the next sub-level (or next level if current level is complete).

        **Auto Promotion:** Triggered automatically when student completes 100% mandatory tasks.

        **Manual Promotion:** Faculty/Admin can call this API anytime regardless of task completion.

        On promotion:
        - Student's `currentLevelId`, `currentSubLevelId`, `syllabusVersionId` are updated
        - Latest active syllabus of the new sub-level is auto-assigned
        - All tasks of the new sub-level are auto-assigned to the student
        - A promotion event is logged in StudentEventLog
        - Previous sub-level task data remains unchanged (data isolation preserved)
      tags:
        - Student
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Student ID
          example: "64fdb61e7b9a1a1234567890"
      responses:
        '200':
          description: Student promoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Student promoted to next sub-level"
                  data:
                    type: object
                    properties:
                      promotedToNewLevel:
                        type: boolean
                        description: true if student moved to a new Level, false if just next SubLevel
                        example: false
                      newLevelId:
                        type: string
                        example: "64fdb61e7b9a1a1234567892"
                      newSubLevelId:
                        type: string
                        example: "64fdb61e7b9a1a1234567893"
                      newSyllabusVersionId:
                        type: string
                        example: "64fdb61e7b9a1a1234567895"
                      tasksAssigned:
                        type: integer
                        description: Number of tasks auto-assigned for the new sub-level
                        example: 10
                      isAuto:
                        type: boolean
                        description: true if triggered automatically, false if manual
                        example: false
        '400':
          description: Student already completed all levels or student is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Student has already completed all levels"
        '404':
          description: Student / SubLevel / Level / Syllabus not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No active syllabus found for the next sub-level"
        '500':
          description: Server error

  /api/students/{id}/readiness-status:
    patch:
